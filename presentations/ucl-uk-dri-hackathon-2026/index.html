ferent. A gene search is a starting point, not a systematic review. Exercise 1: workshop resource page" loading="lazy"></section><section class="slide" aria-label="Slide 7 of 12"><img src="slides/slide-07.png" alt="CLAWBIO  /  TRUSTWORTHY AGENTIC GENOMICS 07 EXERCISE 2  /  DIFFERENTIAL EXPRESSION Interpret the table you actually have. 01 Run the mouse tau example together Check ranked genes, fold changes and adjusted p-values. 02 Inspect the APOE3 versus APOE4 export Check the column names before accepting the result. 03 Compare the renamed-column version The data are the same. The input labels changed. Biological themes are suggestions, not pathway enrichment. Exercise 2: workshop handout" loading="lazy"></section><section class="slide" aria-label="Slide 8 of 12"><img src="slides/slide-08.png" alt="CLAWBIO  /  TRUSTWORTHY AGENTIC GENOMICS 08 A FAILURE TO LOOK FOR The input changes the meaning. Ask what was filtered before this table. THE HANDOUT&#x27;S EXAMPLE REPORTED Every listed gene is significant A Prefiltered table Known B Batch effect? Not shown ? Full analysis Check NEXT: verify the upstream filtering" loading="lazy"></section><section class="slide" aria-label="Slide 9 of 12"><img src="slides/slide-09.png" alt="CLAWBIO  /  TRUSTWORTHY AGENTIC GENOMICS Workshop practice: retain inputs and outputs 09 KEEP AN EVIDENCE TRAIL Keep enough to check the answer later. Inputs Method ›_ Execution Outputs EVIDENCE What ran What changed What failed Replayable ≠ scientifically valid" loading="lazy"></section><section class="slide" aria-label="Slide 10 of 12"><img src="slides/slide-10.png" alt="CLAWBIO  /  TRUSTWORTHY AGENTIC GENOMICS Source: data-handling.md; workshop guidance 10 BEFORE USING YOUR OWN DATA Keep the task and data bounded. Scope Data Budget Approval AGENT Stop / ask Use the supplied exercise data first." loading="lazy"></section><section class="slide" aria-label="Slide 11 of 12"><img src="slides/slide-11.png" alt="CLAWBIO  /  TRUSTWORTHY AGENTIC GENOMICS 11 YOUR PRACTICAL CHECKLIST Run it. Challenge it. Keep the evidence. 01 Choose one claim in the output Point to the exact paper or table entry supporting it. 02 Find one assumption or failure Check missing columns, filtering and contrast direction. 03 Record what you would change Keep the prompt, output and your correction together. Online and in the room: share one useful result and one concern. Follow the two handouts on the workshop resource page." loading="lazy"></section><section class="slide" aria-label="Slide 12 of 12"><img src="slides/slide-12.png" alt="CLAWBIO  /  TRUSTWORTHY AGENTIC GENOMICS 12 NOW TRY IT What would make this output trustworthy? One useful result. One claim to check. github.com/ClawBio/ClawBio" loading="lazy"></section></main>
